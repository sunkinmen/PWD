<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dfeefc">
  <title>臺北市政府工務局｜臺北工務 探索世界</title>
  <meta name="description" content="以 3D 探索臺北市政府工務局與新建、水利、公園路燈、衛生下水道、大地五大工程處。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#" onclick="UI.openA11y();return false;">跳到純文字版（無障礙）</a>

  <!-- 3D 世界 -->
  <div id="world" aria-hidden="true"></div>
  <div id="labels" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 載入畫面 -->
  <div id="loader">
    <div class="loader-emblem" id="loader-emblem"></div>
    <div class="loader-bar"><i id="loader-fill"></i></div>
    <p id="loader-text">正在搭建臺北工務世界…</p>
  </div>

  <!-- 標題畫面 -->
  <section id="title" class="screen" aria-label="開始畫面">
    <div class="title-inner">
      <div class="title-emblems" id="title-emblems"></div>
      <p class="eyebrow">TAIPEI PUBLIC WORKS · EXPLORE</p>
      <h1 id="title-h1">臺北工務 探索世界</h1>
      <p class="title-sub" id="title-sub"></p>
      <div class="title-actions">
        <button class="btn btn-primary btn-lg" onclick="UI.start('explore')"><span class="kbd">Enter</span>開始探索</button>
        <button class="btn btn-glass btn-lg" onclick="UI.start('overview')">城市總覽</button>
      </div>
      <p class="title-foot">第一人稱漫遊・支援電腦與手機　|　<a href="#" onclick="UI.openA11y();return false;">純文字版</a></p>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <header class="topbar">
      <button class="brand" onclick="UI.select('hub')" aria-label="回到工務局本部">
        <span class="brand-emblem" id="brand-emblem"></span>
        <span class="brand-text"><b>臺北市政府工務局</b><small>Public Works Department</small></span>
      </button>
      <div class="top-right">
        <span class="clock" id="clock">--:--</span>
        <button class="icon-btn" onclick="UI.toggleMode()" id="btn-mode" title="切換 探索／總覽"><span id="mode-ico">🚶</span><em id="mode-txt">探索</em></button>
        <button class="icon-btn" onclick="UI.openSearch()" title="搜尋服務" aria-label="搜尋服務">⌕</button>
        <button class="icon-btn" onclick="UI.toggleSound()" title="環境音" aria-label="環境音" id="btn-sound">🔈</button>
        <button class="icon-btn" onclick="UI.openMenu()" title="選單" aria-label="選單">☰</button>
      </div>
    </header>

    <!-- 世界選擇列（PS5 風格） -->
    <nav id="tiles" aria-label="選擇工程世界"></nav>

    <!-- 世界資訊（總覽模式） -->
    <section id="hero" aria-live="polite">
      <div class="hero-badge"><span id="hero-badge"></span><span id="hero-visited" class="visited" hidden>✓ 已造訪</span></div>
      <h2 id="hero-title"></h2>
      <p id="hero-tagline" class="tagline"></p>
      <p id="hero-sub" class="hero-sub"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="UI.enterZone()">▶ 進入世界</button>
        <button class="btn btn-glass" onclick="UI.openSheet()">服務與公告</button>
        <a class="btn btn-ghost" id="hero-link" target="_blank" rel="noopener">官網 ↗</a>
      </div>
      <div class="cards" id="hero-cards"></div>
    </section>

    <!-- 探索模式 HUD -->
    <div id="explore-hud" hidden>
      <canvas id="minimap" width="180" height="180" aria-hidden="true"></canvas>
      <div id="prompt" hidden><span class="kbd">E</span><span id="prompt-text"></span></div>
      <div id="npc-bubble" hidden onclick="UI.nextLine()">
        <div class="npc-head"><b id="npc-name"></b><small id="npc-role"></small></div>
        <p id="npc-text"></p>
        <span class="npc-next">點我或按 E 繼續 ▸</span>
      </div>
      <p class="hint" id="hint">WASD／方向鍵移動・Shift 奔跑・拖曳轉視角</p>
      <div id="joystick" aria-hidden="true"><i></i></div>
    </div>
  </div>

  <!-- 服務與公告面板 -->
  <aside id="sheet" aria-label="服務與公告" hidden>
    <div class="sheet-head">
      <span class="sheet-emblem" id="sheet-emblem"></span>
      <div><small id="sheet-badge"></small><h3 id="sheet-title"></h3></div>
      <button class="icon-btn" onclick="UI.closeSheet()" aria-label="關閉">✕</button>
    </div>
    <div class="sheet-body">
      <h4>常用服務</h4>
      <div class="services" id="sheet-services"></div>
      <h4>最新公告</h4>
      <ul class="news" id="sheet-news"></ul>
      <a class="btn btn-primary btn-block" id="sheet-link" target="_blank" rel="noopener">前往官方網站 ↗</a>
    </div>
  </aside>

  <!-- 選單 -->
  <div class="modal" id="menu" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3>設定</h3><button class="icon-btn" onclick="UI.close('menu')" aria-label="關閉">✕</button></div>
      <h4>季節</h4>
      <div class="seg" id="seg-season">
        <button data-v="spring">🌸 春</button><button data-v="summer">🌻 夏</button><button data-v="autumn">🍁 秋</button><button data-v="winter">❄️ 冬</button>
      </div>
      <h4>角色語音</h4>
      <div class="seg" id="seg-voice"><button data-v="on">🗣️ 開</button><button data-v="off">🔇 關</button></div>
      <h4>畫質</h4>
      <div class="seg" id="seg-quality">
        <button data-v="auto">自動</button><button data-v="high">高畫質</button><button data-v="eco">省電</button>
      </div>
      <h4>其他</h4>
      <div class="menu-list">
        <button onclick="UI.close('menu');UI.openA11y()">♿ 純文字無障礙版</button>
        <button onclick="UI.close('menu');UI.showHelp()">🎮 操作說明</button>
        <a id="menu-official" target="_blank" rel="noopener">🏛️ 工務局官方網站 ↗</a>
      </div>
      <p class="fine" id="menu-foot"></p>
    </div>
  </div>

  <!-- 搜尋 -->
  <div class="modal" id="search" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3>想找什麼服務？</h3><button class="icon-btn" onclick="UI.close('search')" aria-label="關閉">✕</button></div>
      <input id="search-input" type="search" placeholder="例如：路燈不亮、借河濱場地、污水接管、登山步道" autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- 純文字無障礙版 -->
  <section id="a11y" hidden aria-label="純文字版">
    <div class="a11y-inner">
      <button class="btn btn-glass" onclick="UI.close('a11y')">← 回到 3D 版</button>
      <h1 id="a11y-h1"></h1>
      <div id="a11y-list"></div>
    </div>
  </section>

  <div id="toast" role="status"></div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/emblems.js"></script>
  <script src="js/world.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
